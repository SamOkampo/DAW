name: FLOWDAW CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure core
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFLOWDAW_BUILD_APP=OFF -DFLOWDAW_BUILD_TESTS=ON
      - name: Build core and tests
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Doctor smoke test
        run: ./build/flowdaw-doctor status
      - name: Build stretch benchmark
        run: cmake --build build --target flowdaw_stretch_benchmark --parallel
      - name: Benchmark stretch backend
        run: ./build/flowdaw_stretch_benchmark

  studio-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Studio build dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev
      - name: Configure Studio
        run: cmake -S . -B build-studio -DCMAKE_BUILD_TYPE=Release -DFLOWDAW_BUILD_APP=ON -DFLOWDAW_BUILD_TESTS=OFF
      - name: Build Studio executable
        run: cmake --build build-studio --parallel --target flowdaw flowdaw-doctor
      - name: Install smoke test
        run: cmake --install build-studio --prefix "$RUNNER_TEMP/flowdaw-install" && test -x "$RUNNER_TEMP/flowdaw-install/bin/flowdaw" && test -x "$RUNNER_TEMP/flowdaw-install/bin/flowdaw-doctor" && "$RUNNER_TEMP/flowdaw-install/bin/flowdaw-doctor" status
      - name: Package smoke test
        run: cd build-studio && cpack -G TGZ && test -n "$(find . -maxdepth 1 -name 'FLOWDAW-*.tar.gz' -print -quit)"

  juce-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install JUCE Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libxcomposite-dev libxrender-dev libxi-dev libgl1-mesa-dev
      - name: Configure JUCE 9.0.2 runtime
        run: cmake -S . -B build-juce -DCMAKE_BUILD_TYPE=Release -DFLOWDAW_BUILD_APP=OFF -DFLOWDAW_BUILD_TESTS=ON -DFLOWDAW_ENABLE_JUCE_RUNTIME=ON -DFLOWDAW_FETCH_JUCE=ON -DFLOWDAW_BUILD_JUCE_APP=ON -DFLOWDAW_BUILD_JUCE_TEST_PLUGIN=ON
      - name: Build JUCE desktop and real VST3 fixtures
        run: cmake --build build-juce --parallel 2 --target flowdaw-juce flowdaw_phase7_juce_tests flowdaw_phase8_juce_tests flowdaw-doctor
      - name: Execute real VST3 host integration tests
        run: ctest --test-dir build-juce -R flowdaw_phase7_juce_tests --output-on-failure && ctest --test-dir build-juce -R flowdaw_phase8_juce_tests --output-on-failure
      - name: Install JUCE desktop smoke test
        run: cmake --install build-juce --prefix "$RUNNER_TEMP/flowdaw-juce-install" && test -x "$RUNNER_TEMP/flowdaw-juce-install/bin/FLOWDAW" && test -x "$RUNNER_TEMP/flowdaw-juce-install/bin/flowdaw-doctor" && "$RUNNER_TEMP/flowdaw-juce-install/bin/flowdaw-doctor" status


  windows-juce:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure JUCE 9.0.2 runtime
        run: cmake -S . -B build-win -DFLOWDAW_BUILD_APP=OFF -DFLOWDAW_BUILD_TESTS=ON -DFLOWDAW_ENABLE_JUCE_RUNTIME=ON -DFLOWDAW_FETCH_JUCE=ON -DFLOWDAW_BUILD_JUCE_APP=ON -DFLOWDAW_BUILD_JUCE_TEST_PLUGIN=ON
      - name: Build Windows desktop and real VST3 fixtures
        run: cmake --build build-win --config Release --parallel 2 --target flowdaw-juce flowdaw_phase7_juce_tests flowdaw_phase8_juce_tests flowdaw-doctor
      - name: Execute Windows VST3 host integration tests
        run: ctest --test-dir build-win -C Release -R "flowdaw_phase(7|8)_juce_tests" --output-on-failure
      - name: Install Windows desktop smoke test
        shell: pwsh
        run: |
          cmake --install build-win --config Release --prefix "$env:RUNNER_TEMP/flowdaw-windows-install"
          if (-not (Test-Path "$env:RUNNER_TEMP/flowdaw-windows-install/bin/FLOWDAW.exe")) { throw "FLOWDAW.exe missing after install" }
          if (-not (Test-Path "$env:RUNNER_TEMP/flowdaw-windows-install/bin/flowdaw-doctor.exe")) { throw "flowdaw-doctor.exe missing after install" }
          & "$env:RUNNER_TEMP/flowdaw-windows-install/bin/flowdaw-doctor.exe" status
      - name: Package Windows portable build
        shell: pwsh
        run: |
          Push-Location build-win
          cpack -C Release -G ZIP
          if (-not (Get-ChildItem -Filter "FLOWDAW-*.zip")) { throw "FLOWDAW Windows ZIP package missing" }
          Pop-Location

  macos-juce:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure JUCE 9.0.2 runtime with AU host
        run: cmake -S . -B build-mac -DCMAKE_BUILD_TYPE=Release -DFLOWDAW_BUILD_APP=OFF -DFLOWDAW_BUILD_TESTS=ON -DFLOWDAW_ENABLE_JUCE_RUNTIME=ON -DFLOWDAW_FETCH_JUCE=ON -DFLOWDAW_BUILD_JUCE_APP=ON -DFLOWDAW_BUILD_JUCE_TEST_PLUGIN=ON
      - name: Build macOS desktop, VST3 and AU fixtures
        run: cmake --build build-mac --parallel 2 --target flowdaw-juce flowdaw_phase7_juce_tests flowdaw_phase8_juce_tests flowdaw-doctor
      - name: Register AU fixtures with CoreAudio
        run: |
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          find build-mac -type d -path "*/Release/AU/*.component" -maxdepth 8 -print0 | while IFS= read -r -d '' component; do
            ditto "$component" "$HOME/Library/Audio/Plug-Ins/Components/$(basename "$component")"
          done
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -a >/dev/null 2>&1 || true
      - name: Execute macOS VST3 and AU host integration tests
        run: ctest --test-dir build-mac -R "flowdaw_phase(7|8)_(juce|au)_tests" --output-on-failure
      - name: Install macOS desktop smoke test
        run: |
          cmake --install build-mac --prefix "$RUNNER_TEMP/flowdaw-macos-install"
          test -x "$RUNNER_TEMP/flowdaw-macos-install/FLOWDAW.app/Contents/MacOS/FLOWDAW"
          test -x "$RUNNER_TEMP/flowdaw-macos-install/bin/flowdaw-doctor"
          "$RUNNER_TEMP/flowdaw-macos-install/bin/flowdaw-doctor" status
      - name: Package macOS DMG
        run: |
          cd build-mac
          cpack -G DragNDrop
          test -n "$(find . -maxdepth 1 -name 'FLOWDAW-*.dmg' -print -quit)"
